# Príklad Nginx — root MUSÍ ukazovať na backend/public/
server {
    listen 443 ssl http2;
    server_name insulin.example.com;
    root /var/www/glukoview-insulin/public;
    index index.php;

    # SSL certifikáty (Let's Encrypt / hosting panel)
    # ssl_certificate     /etc/letsencrypt/live/insulin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/insulin.example.com/privkey.pem;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # upravte podľa verzie
    }

    location ~ /\. {
        deny all;
    }
}

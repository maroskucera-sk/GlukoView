# Príklad Apache VirtualHost — document root MUSÍ ukazovať na backend/public/
<VirtualHost *:443>
    ServerName insulin.example.com
    DocumentRoot /var/www/glukoview-insulin/public

    <Directory /var/www/glukoview-insulin/public>
        AllowOverride All
        Require all granted
    </Directory>

    # config/ a src/ nie sú vo webroote — tak to má byť
    SSLEngine on
    # SSLCertificateFile / ...
    # SSLCertificateKeyFile / ...
</VirtualHost>

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32 @ 6.3.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
build_flags_common = 
	-DBOARD_HAS_PSRAM
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_48=1
	-DFIRMWARE_VERSION_MAJOR=1
	-DFIRMWARE_VERSION_MINOR=0
	-Iinclude
	'-DWM_STRINGS_FILE="wm_strings_sk.h"'
	-DWM_NOHELP
lib_deps_common = 
	bblanchon/ArduinoJson @ ^7.0.4
	tzapu/WiFiManager @ ^2.0.16
	lvgl/lvgl @ ~8.3.11

[env:waveshare_s3_1_28]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.flash_mode = ${common.board_build.flash_mode}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_build.partitions = ${common.board_build.partitions}
build_flags = 
	${common.build_flags_common}
	-DDIA_BOARD_WS_1_28
	-D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = 
	+<*>
	-<board/board_ws_3_5.cpp>
lib_deps = 
	${common.lib_deps_common}
	moononournation/GFX Library for Arduino @ 1.4.5
	fbiego/CST816S @ ^1.1.1

[env:waveshare_s3_3_5]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 115200
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = ${common.board_build.partitions}
build_flags = 
	${common.build_flags_common}
	-DDIA_BOARD_WS_3_5
	-DBOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ARDUINO_USB_MODE=1
build_src_filter = 
	+<*>
	-<board/board_ws_1_28.cpp>
lib_deps = 
	${common.lib_deps_common}
	RobTillaart/TCA9554 @ ^0.1.2
	lewisxhe/XPowersLib @ ^0.2.9
	moononournation/GFX Library for Arduino@1.5.5

[env:waveshare_s3_3_5_manual]
extends = env:waveshare_s3_3_5
upload_speed = 115200
upload_flags = 
	--before=no_reset
	--after=hard_reset
